name = "ys-planner"
account_id = "f59ba441082028e40ca5fd088b154e5d" # Yannick Dev (Zone salm.li)
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Alle Dateien (Knowledge Base, Task-Anhänge, Mail-Anhänge). Zugriff nur über Route Handler.
#   kb/{planner_id}/{kb_file_id}.md
#   tasks/{task_id}/{file_id}-{dateiname}
#   inbox/{user_id}/{task_id}/{file_id}-{dateiname}
[[r2_buckets]]
binding = "FILES"
bucket_name = "planner-files"
# Auch `npm run dev` nutzt den echten Bucket – die Metadaten liegen ebenfalls in der echten DB
remote = true

# Täglich 07:00 Europe/Zurich: 06:00 UTC (Winter) bzw. 05:00 UTC (Sommer).
# Der Endpoint prüft die lokale Stunde und läuft nur um 07:00.
[triggers]
crons = ["0 5 * * *", "0 6 * * *"]

[[routes]]
pattern = "planner.salm.li"
custom_domain = true

[vars]
APP_URL = "https://planner.salm.li"
NEXT_PUBLIC_SUPABASE_URL = "https://sqeundlhrhlepfssroad.supabase.co"
NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_mXtHzeKjuc5TPGlQp_jr0w_lsTV_142"
ZITADEL_ISSUER = "https://auth.yannicksalm.ch"
ZITADEL_CLIENT_ID = "397241212362359554"
MAIL_FROM = "ys-planner <no-reply@salm.li>"
# Mail an Planner: {zufall}@INBOX_DOMAIN (Cloudflare Email Routing, Catch-all → dieser Worker)
INBOX_DOMAIN = "salm.li"

# Secrets (nicht hier eintragen!):
#   wrangler secret put SUPABASE_SECRET_KEY
#   wrangler secret put SUPABASE_JWT_PRIVATE_KEY
#   wrangler secret put SESSION_SECRET
#   wrangler secret put SHARE_LINK_SECRET
#   wrangler secret put CRON_SECRET
#   wrangler secret put RESEND_API_KEY
#   (optional) wrangler secret put ZITADEL_CLIENT_SECRET
